name = "traderpro-telegram-webhook"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "7572bca2bf8f1423bb850a0d1296fb1c"

# ВАЖНО: kv_namespaces — верхнеуровневый ключ, и в формате TOML он ОБЯЗАН стоять здесь,
# до открытия секции [vars] ниже. Если написать его ПОСЛЕ "[vars]" (как было раньше),
# TOML молча читает его как vars.kv_namespaces — обычную текстовую переменную, а не
# настоящее подключение к хранилищу. Внешне ошибки не видно нигде, кроме поведения в
# рантайме: сервер получает env.DECISIONS = undefined и падает с "Cannot read properties
# of undefined (reading 'put')" именно в момент, когда нужно записать решение по кнопке
# (баг был с самого первого деплоя — маскировался тем, что кнопка «Пропустил» до записи
# в хранилище не доходит и потому выглядела рабочей).
kv_namespaces = [
  { binding = "DECISIONS", id = "e54729c02d594cfbaa969681642f00bb" },
]

# Будильник робота (см. src/index.js, экспорт scheduled) — Cloudflare сам, по надёжному
# таймеру, стучится в GitHub и просит запустить робота немедленно (workflow_dispatch),
# вместо того чтобы полагаться на собственное расписание GitHub (оно best-effort и на
# практике срабатывало в разы реже, чем задано). Часы и дни те же, что были в cron
# самого GitHub-воркфлоу — по будням, в торговые часы MOEX с запасом.
[triggers]
# Все дни недели, не только будни: с 2026 года Мосбиржа торгует акциями и срочным рынком
# и по выходным (09:50–19:00 МСК = 06:50–16:00 UTC, в окно 4–20 UTC укладывается). Сам
# робот по расписанию биржи (tradingSchedule.js) решает, работать ли — лишний тик в закрытый
# день просто выходит с "рынки закрыты".
crons = ["*/15 4-20 * * *"]

# Секреты задаются командой `wrangler secret put <ИМЯ>`, не здесь — этот файл
# коммитится в репозиторий и не должен видеть токены.
#
#   BOT_TOKEN             — токен телеграм-бота
#   WEBHOOK_SECRET        — секретный заголовок вебхука Telegram
#   TINKOFF_TRADE_TOKEN   — торговый токен Т-Банка (ТОЛЬКО здесь, никогда в браузере)
#   TRADING_DISABLED      — стоп-кран: значение "true" мгновенно выключает отправку заявок
#
# Номер счёта отдельным секретом задавать НЕ нужно: один торговый токен обычно открывает
# сразу несколько счетов (обычный/ИИС), поэтому счёт запрашивается у брокера по токену
# и выбирается прямо в окне подтверждения заявки. Если счёт всего один — выбирать нечего,
# сервер подставит его сам.
#
# Открытые настройки ниже — не секреты, их видно в репозитории и это нормально.
# TICKER_WHITELIST — единственный список, по которому вообще разрешено торговать.
# Пустой список = запрещено всё: молчание не должно открывать доступ. "*" (ровно одна
# звёздочка, без других символов) — явный отказ от списка: разрешён ЛЮБОЙ тикер. Владелец
# сам подключал API именно затем, чтобы открывать/закрывать через кнопку что угодно —
# это его решение по его собственному счёту, а не значение по умолчанию.
[vars]
FIREBASE_PROJECT_ID = "trader-app-6517b"
OWNER_UID = "1stzQToO77e61ubwLuo3g5KK1DI3"
ALLOWED_ORIGIN = "*"      # замените на адрес приложения, когда он появится (https://ваш-домен)
TICKER_WHITELIST = "*"
# MAX_ORDER_RUB = "100000"   # потолок суммы одной заявки; не задан — не проверяется
