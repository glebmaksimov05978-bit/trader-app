name = "traderpro-telegram-webhook"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "7572bca2bf8f1423bb850a0d1296fb1c"

# Секреты задаются командой `wrangler secret put <ИМЯ>`, не здесь — этот файл
# коммитится в репозиторий и не должен видеть токены.
#
#   BOT_TOKEN             — токен телеграм-бота
#   WEBHOOK_SECRET        — секретный заголовок вебхука Telegram
#   TINKOFF_TRADE_TOKEN   — торговый токен Т-Банка (ТОЛЬКО здесь, никогда в браузере)
#   TRADING_DISABLED      — стоп-кран: значение "true" мгновенно выключает отправку заявок
#
# Номер счёта отдельным секретом задавать НЕ нужно: один торговый токен обычно открывает
# сразу несколько счетов (обычный/ИИС), поэтому счёт запрашивается у брокера по токену
# и выбирается прямо в окне подтверждения заявки. Если счёт всего один — выбирать нечего,
# сервер подставит его сам.
#
# Открытые настройки ниже — не секреты, их видно в репозитории и это нормально.
# TICKER_WHITELIST — единственный список, по которому вообще разрешено торговать.
# Пустой список = запрещено всё: молчание не должно открывать доступ.
[vars]
FIREBASE_PROJECT_ID = "trader-app-6517b"
OWNER_UID = ""            # впишите свой uid — см. инструкцию, как его найти
ALLOWED_ORIGIN = "*"      # замените на адрес приложения, когда он появится (https://ваш-домен)
TICKER_WHITELIST = "SBER, GAZP, LKOH"   # впишите СВОИ разрешённые тикеры через запятую
# MAX_ORDER_RUB = "100000"   # потолок суммы одной заявки; не задан — не проверяется

kv_namespaces = [
  { binding = "DECISIONS", id = "e54729c02d594cfbaa969681642f00bb" },
]
