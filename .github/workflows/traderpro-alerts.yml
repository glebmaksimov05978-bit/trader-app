name: "Фоновые роботы: уведомления и бумажные сделки"

# Окно запуска покрывает ВСЕ сессии Мосбиржи: с утренней (07:00 МСК = 04:00 UTC) до конца
# вечерней (23:50 МСК = 20:50 UTC), по будням. Раньше здесь стояло 07-15 UTC — робот
# засыпал в 18:40 МСК и всю вечернюю сессию не видел вообще, а по фьючерсам это живая
# половина торгового дня.
#
# Точное расписание по типам инструментов (и единственный клиринг 23:50-00:30) живёт в
# src/services/marketData/tradingSchedule.js — сам скрипт по нему ещё раз проверяет, идут
# ли торги, и молча выходит, если нет. Здесь окно намеренно шире: cron не знает про
# сессии, его задача — просто будить скрипт достаточно часто.
on:
  schedule:
    # Все дни недели: с 2026 года биржа торгует и по выходным (сессия 09:50-19:00 МСК).
    - cron: '*/15 4-20 * * *'
  workflow_dispatch:        # кнопка «запустить вручную» во вкладке Actions
    inputs:
      force:
        description: 'Проверить даже вне торговой сессии (для теста)'
        type: boolean
        default: false
      paper_dry:
        description: 'Бумажные сделки: только показать, что открылось бы, не записывать'
        type: boolean
        default: true

# Без этого GitHub отключает расписание в репозиториях, где давно не было коммитов.
# Если увидишь, что уведомления перестали приходить, — зайди в Actions и нажми Enable.

# Запуски идут строго по одному. Робота теперь будят сразу три независимых источника
# (Cloudflare Cron, внешний cron-job.org и собственное расписание GitHub), и в :00/:15/:30/:45
# они бьют почти одновременно. Без очереди два прохода читали бы список открытых бумажных
# сделок ДО записи друг друга и открыли бы одну и ту же сделку дважды (и продублировали
# бы сообщения в Telegram). cancel-in-progress: false — идущий проход не обрывается, а
# лишние ожидающие GitHub сам схлопывает до одного.
permissions:
  contents: read
  actions: read

concurrency:
  group: traderpro-robots
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ворота: два-три будильника бьют в :00/:15/:30/:45 почти одновременно, и запускалось ДВА одинаковых прохода подряд — второй
      # ничего нового не делал, но заново читал базу. Бесплатный тариф Firebase даёт 50 000 чтений в сутки; дубли вдвое ускоряли
      # исчерпание лимита, после чего все шаги падали (письма «Run failed», утренняя сводка после 11:00). Если соседний запуск
      # (создан ≤ 4 минут назад и завершён) уже сделал проход — этот пропускаем целиком. Любая трудность — проход не пропускается.
      - name: Ворота (пропуск дубля прохода)
        id: gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/alerts/gate.mjs

      # @resvg/resvg-js — рисует PNG-картинку графика для сообщения о входе (без него сообщение
      # просто уходит текстом). Шрифт с кириллицей для подписей на картинке — DejaVu.
      - name: Установить firebase-admin, рисовалку графиков и сборщик PDF
        if: steps.gate.outputs.skip != 'true'
        run: |
          # Все пакеты ставятся одной командой (npm --no-save убирает «лишние» пакеты прошлой установки).
          # Не встала рисовалка — ставим без неё (картинок не будет); не встал pdfmake — только firebase-admin (отчёты по расписанию
          # не уйдут, остальные роботы работают).
          # nodemailer — отправка отчётов на почту (SMTP); ставится вместе с pdfmake.
          npm install firebase-admin@12 @resvg/resvg-js@2.6.2 pdfmake@0.3.13 nodemailer@6.9.16 --no-save || npm install firebase-admin@12 pdfmake@0.3.13 nodemailer@6.9.16 --no-save || npm install firebase-admin@12 pdfmake@0.3.13 --no-save || npm install firebase-admin@12 --no-save
          fc-list | grep -qi dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core) || true

      # Сторож: если в торговое время давно не было запусков от будильников — предупреждение в Telegram.
      - name: Сторож будильников
        timeout-minutes: 2
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: node scripts/alerts/watchdog.mjs

      # Утренняя сводка в Telegram (стоит В НАЧАЛЕ задания: она дешёвая, а длинные шаги ниже раньше упирались в лимит времени и до неё не доходили) — один раз в сутки при первом проходе после 8:00 МСК
      # (час и выключатель — в Настройках). Отметка «сегодня слали» хранится в профиле, поэтому три
      # будильника сообщение не дублируют.
      - name: Утренняя сводка
        timeout-minutes: 3
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/alerts/morningDigest.mjs --dry
          else
            node scripts/alerts/morningDigest.mjs
          fi

      # Отчёты по расписанию: PDF за выбранный период файлом в Telegram, на почту (SMTP_*) и/или в MAX (MAX_*) — на выбор для каждого
      # расписания (настраиваются в приложении: Отчёт → Выгрузить отчёт → «По расписанию»). Ключи почты и MAX — в GitHub Secrets; пока их
      # нет, этот канал просто не работает (в приложении видно «не подключено»), а остальные не страдают. Дешёвый шаг: если сегодня слать нечего, скрипт ничего не собирает. Отметка «сегодня слали» — в профиле
      # (users/<uid>.reportSendLog), поэтому три будильника отчёт не дублируют. При ручном запуске с галочкой «paper_dry» — только проверка.
      - name: Отчёты по расписанию
        timeout-minutes: 4
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_USER_ID: ${{ secrets.MAX_USER_ID }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/reports/runScheduledReports.mjs --dry --out report_dry
          else
            node scripts/reports/runScheduledReports.mjs
          fi

      - name: Проверить позиции и отправить уведомления
        timeout-minutes: 6
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          FORCE_CHECK: ${{ github.event.inputs.force }}
        run: node scripts/alerts/runAlerts.mjs

      # Второй робот: обходит радар и открывает бумажные сделки. Отдельным шагом в том же
      # задании, а не отдельным workflow — так GitHub поднимает окружение (checkout +
      # установка firebase-admin) один раз на оба, а не дважды, и расход минут не удваивается.
      #
      # continue-on-error намеренно: робот уведомлений только что починили после того, как
      # он не работал вообще ни разу, и новый непроверенный шаг не должен иметь возможности
      # уронить его вместе с собой.
      #
      # При ручном запуске по умолчанию идёт сухой прогон: показывает, что открылось бы, и
      # ничего не пишет в базу. По расписанию работает по-настоящему.
      - name: Бумажные сделки по радару
        timeout-minutes: 9
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          FORCE_CHECK: ${{ github.event.inputs.force }}
          # Без этих двух робот молча не отправит ничего: notifyPaper() выходит сразу,
          # если токена или чата нет — сделку он при этом всё равно запишет.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Пустое значение бывает ТОЛЬКО при запуске по расписанию (у события schedule нет
        # inputs) — и тогда робот работает по-настоящему. Сухой прогон включается лишь
        # явным "true", что и стоит по умолчанию у кнопки ручного запуска.
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/paper/runPaperTrades.mjs --dry
          else
            node scripts/paper/runPaperTrades.mjs
          fi

      # Третий робот: ведёт уже открытые бумажные сделки и закрывает их сам — по стопу и
      # цели там, где они есть, и следящим выходом там, где стратегия сознательно торгует
      # без стопа. Идёт ПОСЛЕ открытия: сделка, открытая на этом же проходе, получит первую
      # проверку на следующем, когда появится новый бар — раньше проверять нечего.
      #
      # FORCE_CHECK здесь не нужен: у ведения нет привязки к часам сессии, его собственное
      # условие — «появился ли новый бар», и вне торгов оно само ничего не делает.
      - name: Ведение бумажных сделок
        timeout-minutes: 6
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/paper/managePaperTrades.mjs --dry
          else
            node scripts/paper/managePaperTrades.mjs
          fi

      # Четвёртый шаг: снимок состояния для меню в Telegram (один за проход: ранний второй снимок убран — он перечитывал всю историю дважды) (сделки, бумажные, радар, статус
      # робота) — складывается в Cloudflare KV, откуда его читает бот. Только чтение базы;
      # идёт ПОСЛЕ остальных, чтобы в снимок попали свежие итоги этого прохода.
      - name: Снимок для меню Telegram
        timeout-minutes: 3
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: node scripts/telegram/writeSnapshot.mjs

      # Пятый шаг: автоочистка радара — истёкший фьючерс заменяется на «корень» (он сам переходит
      # на новый контракт), несуществующие инструменты убираются, об этом приходит сообщение.
      # Отключается в профиле (alertPrefs.radarAutoCleanup = false). Любой сбой безвреден.
      - name: Автоочистка радара
        timeout-minutes: 3
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/radar/cleanupRadar.mjs --dry
          else
            node scripts/radar/cleanupRadar.mjs
          fi

      # ГО и параметры фьючерсов: раз в час (сам пропускает свежее) подтягивает ГО/цену/шаг/экспирацию по фьючерсам из радара и позиций,
      # пишет состояние в базу (futuresMargin/<uid>) — приложение показывает по нему ГО и плечо в радаре — и шлёт в Telegram, если ГО
      # (а значит и плечо) изменилось, контракт у «корня» сменился или у открытой позиции близка экспирация. Настройки — в приложении
      # (Настройки → «Фьючерсы: ГО и плечо»). Источник — биржа; если заданы RELAY_URL и RELAY_KEY, то ещё и ГО Т-Банка (лонг и шорт отдельно).
      - name: ГО и параметры фьючерсов
        timeout-minutes: 3
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_URL_BACKUP: ${{ secrets.RELAY_URL_BACKUP }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/futures/syncMargins.mjs --dry
          else
            node scripts/futures/syncMargins.mjs
          fi

      # Шестой шаг: переносит в Журнал сделки, исполненные кнопками в Telegram (закрытие и открытие
      # по бумажной). Воркер бота оставляет записи fill:… в хранилище — здесь они превращаются в
      # записи Журнала тем же расчётом, что и в приложении. Повторный запуск безопасен.
      - name: Перенос сделок из Telegram в Журнал
        timeout-minutes: 3
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/telegram/applyFills.mjs --dry
          else
            node scripts/telegram/applyFills.mjs
          fi

      # Седьмой шаг: отметки ВАШИХ действий. Читает позиции в Т-Банке (только чтение, через
      # российского посредника) и по появлению/уменьшению/исчезновению позиции отмечает в бумажных
      # сделках «вошёл», «снял часть», «вышел». Заявок не отправляет — у шага нет на это ни кода, ни
      # ключа. Без секретов RELAY_URL и RELAY_KEY молча пропускается. Отключается в Настройках
      # (alertPrefs.brokerActionSync = false).
      - name: Отметки действий по позициям в Т-Банке
        timeout-minutes: 3
        if: always() && steps.gate.outputs.skip != 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_UIDS: ${{ secrets.ALERT_UIDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_URL_BACKUP: ${{ secrets.RELAY_URL_BACKUP }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          if [ "${{ github.event.inputs.paper_dry }}" = "true" ]; then
            node scripts/paper/syncActions.mjs --dry
          else
            node scripts/paper/syncActions.mjs
          fi
